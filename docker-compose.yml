version: '3.8'

services:
  web:
    build: .
    container_name: eject_ecommerce_api
    # Sobrescreve o comando padrão para garantir a execução segura de rotinas
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1